[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-ot"
version = "0.1.0"
description = "Reproducible neural optical-turbulence research pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dvc>=3.60,<4",
  "fastapi>=0.115,<1",
  "hydra-core>=1.3,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "lightning>=2.6,<3",
  "matplotlib>=3.9,<4",
  "mlflow>=3.14,<4",
  "netcdf4>=1.7,<2",
  "numpy>=2.1,<3",
  "omegaconf>=2.3,<3",
  "optuna>=4.9,<5",
  "optuna-integration[pytorch_lightning]>=4.9,<5",
  "pandas>=2.2,<3",
  "polars>=1.20,<2",
  "prefect>=3.8,<4",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "torch>=2.8,<3",
  "torchmetrics>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
  "xarray>=2024.10",
  "zarr>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "tecto>=0.16.9,<0.17",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0",
]
data = [
  "astral>=2.2,<4",
  "lightgbm>=4.6,<5",
]
cloud = [
  "skypilot[runpod,lambda,vast]>=0.10,<1",
]

[project.scripts]
strata-acquire = "strata_ot.data.acquire:main"
strata-train = "strata_ot.training.train:main"
strata-forecast = "strata_ot.training.forecast:main"
strata-horizon = "strata_ot.training.horizon:main"
strata-fusion = "strata_ot.training.fusion:main"
strata-evaluate = "strata_ot.evaluation.evaluate:main"
strata-report = "strata_ot.reporting.render:main"
strata-loop = "strata_ot.autonomy.loop:main"
strata-first-flow = "strata_ot.orchestration.flows:main"
strata-forecast-flow = "strata_ot.orchestration.flows:forecast_main"
strata-horizon-flow = "strata_ot.orchestration.flows:horizon_main"
strata-fusion-flow = "strata_ot.orchestration.flows:fusion_main"
strata-fusion-program = "strata_ot.orchestration.flows:fusion_program_main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[tool.hatch.build.targets.wheel]
packages = ["src/strata_ot"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".agents", ".venv", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["strata_ot"]

[[tool.mypy.overrides]]
module = [
  "otbench",
  "otbench.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
