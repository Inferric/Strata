services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strata-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strata}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-strata}:${POSTGRES_PASSWORD:-strata-local-only}@postgres:5432/mlflow
      - --artifacts-destination
      - /mlartifacts
      - --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prefect:
    build:
      context: .
      dockerfile: docker/prefect.Dockerfile
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-strata}:${POSTGRES_PASSWORD:-strata-local-only}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      STRATA_WEB_ORIGINS: http://localhost:${STRATA_WEB_PORT:-3000},http://127.0.0.1:${STRATA_WEB_PORT:-3000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/manifests:/app/data/manifests:ro
      - ./artifacts:/app/artifacts:ro
      - ./reports/generated:/app/reports/generated:ro
    depends_on:
      - mlflow
      - prefect
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_MLFLOW_URL: ${VITE_MLFLOW_URL:-http://localhost:5000}
        VITE_PREFECT_URL: ${VITE_PREFECT_URL:-http://localhost:4200}
    ports:
      - "127.0.0.1:${STRATA_WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  mlartifacts:
