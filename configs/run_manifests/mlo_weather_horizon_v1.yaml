assumptions:
  - The existing public OTBench MLO snapshot is the only dataset needed.
  - The official MLO test files remain sealed and are never loaded by this experiment.
  - Validation feature identities may be read before assessment release; assessment labels may not.
  - Six retained context rows represent 30 nominal minutes only when cadence checks pass.
  - All learned models use the same stacked set of 5, 15, 30, and 60 minute examples.
  - Zero-filled weather slots in history_only carry no raw weather information and keep control shapes identical.
  - Weather, target history, and cadence normalization are fitted only on the purged official training block.
  - The literature supports custom-adaptation wording, not a universal novelty claim.
  - A partial or null assessment result ends this bounded cycle without retuning.
