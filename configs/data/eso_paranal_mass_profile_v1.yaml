help_url: https://archive.eso.org/wdb/help/eso/ambient_paranal.html
license_url: https://www.eso.org/public/science/archive/
citation: >-
  European Southern Observatory, Paranal Ambient Conditions Database,
  Multi-Aperture Scintillation Sensor (MASS), January 2020 bounded
  snapshot; acknowledge ESO and cite Kornilov et al. (2007),
  MNRAS 382, 1268-1278.
access: anonymous_public_archive_cc_by
