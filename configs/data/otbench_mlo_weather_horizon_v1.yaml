id: otbench-mlo-cn2-15m-weather-horizon-v1
source_dataset_id: otbench-mlo-cn2-15m-v1
adapter: otbench
task: regression.mlo_cn2.dropna.Cn2_15m
derived_task: repository_defined_multi_horizon_forecast
upstream_repository: https://github.com/CDJellen/otbench.git
upstream_commit: 53cab9d53648b4870b43e35d48f19143786fa12e
label:
  name: Cn2_15m
  representation: log10_cn2_m_minus_2_over_3
  provenance_class: direct_observation
site: Mauna Loa Observatory
access: open_via_existing_verified_snapshot
cache_dir: data/raw/otbench/canonical-v1
manifest_path: data/manifests/otbench-mlo-cn2-15m-v1.json
split_config: configs/splits/frozen/otbench_mlo_weather_horizon_v1.yaml
forecast:
  window_rows: 6
  horizon_rows: [1, 3, 6, 12]
  horizon_minutes: [5, 15, 30, 60]
  nominal_cadence_minutes: 5
  maximum_context_gap_minutes: 7.5
  horizon_tolerance_minutes: 2.5
feature_sets:
  history_only:
    raw_allowlist: []
    weather_enabled: false
  operational_weather:
    raw_allowlist:
      - Dir_10m
      - Spd_10m
      - P_2m
      - T_2m
      - RH_2m
      - Tdew_2m
    circular_degrees:
      - Dir_10m
    weather_enabled: true
resolved_weather_channels:
  - Dir_10m_sin
  - Dir_10m_cos
  - Spd_10m
  - P_2m
  - T_2m
  - RH_2m
  - Tdew_2m
excluded_primary_patterns:
  - covariance_or_flux_pairs
  - qc_flags
  - diagnostic_channels
  - sample_counts
  - instrument_water_vapor_channels
notes:
  - Development-only forecasting view over the already acquired MLO snapshot.
  - The official test partition remains sealed and is not loaded.
  - History-only uses zero weather slots solely to preserve identical control tensor shapes.

